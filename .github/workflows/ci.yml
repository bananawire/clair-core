name: Build and Test - Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-backend-tests:
    name: Build and Run Test Suites
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify -Djava.version=25 -Dmaven.compiler.release=25

  deploy:
    name: Trigger Dokploy Deployment
    needs: run-backend-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger Dokploy Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "🚀 Triggering Dokploy deployment webhook for ref: ${{ github.ref }}..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref": "${{ github.ref }}"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "❌ Error: Failed to trigger Dokploy deployment"
            exit 1
          fi
          echo "✅ Dokploy deployment triggered successfully!"