# BDD (Cucumber) and system tests: the app runs on a random port against real PostgreSQL + Redis.
# CI already exports CLAIR_TEST_POSTGRES_*. Locally either:
#   - use the dedicated clair_test database (the fallbacks below), or
#   - point at docker-compose.local.yml by exporting
#     CLAIR_TEST_POSTGRES_URL=jdbc:postgresql://localhost:5432/clair_core
#     CLAIR_TEST_POSTGRES_USER=clair
#     CLAIR_TEST_POSTGRES_PASSWORD=clair
spring.datasource.url=${CLAIR_TEST_POSTGRES_URL:jdbc:postgresql://localhost:5432/clair_test}
spring.datasource.username=${CLAIR_TEST_POSTGRES_USER:clair_test}
spring.datasource.password=${CLAIR_TEST_POSTGRES_PASSWORD:clair_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

claircore.local-edge.enabled=false
claircore.alerts.catch-up-initial-delay-ms=3600000
claircore.alerts.catch-up-interval-ms=3600000

jwt.secret=clair-system-test-secret-key-at-least-32-bytes-long
frontend.url=http://localhost:4200
cors.allowed-origins=http://localhost:4200

google.oauth.client-id=dummy-client-id.apps.googleusercontent.com
google.oauth.client-secret=dummy-client-secret
google.oauth.redirect-uri=http://localhost/api/v1/auth/google/callback

stripe.api.key=sk_test_dummy
stripe.public.key=pk_test_dummy
stripe.webhook.secret=whsec_dummy

onesignal.rest-api-key=dummy
onesignal.app-id=dummy

SMTP_FROM=noreply@clair.test
