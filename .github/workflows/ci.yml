name: Build and Test - Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-backend-tests:
    name: Build and Run Test Suites
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: clair_test
          POSTGRES_PASSWORD: clair_test
          POSTGRES_DB: clair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clair_test -d clair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAIR_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/clair_test
      CLAIR_TEST_POSTGRES_USER: clair_test
      CLAIR_TEST_POSTGRES_PASSWORD: clair_test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify -Djava.version=25 -Dmaven.compiler.release=25
