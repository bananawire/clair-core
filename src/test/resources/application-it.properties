# Profile "it": full Spring context for core integration tests, hermetic (H2 in memory, no Redis,
# no external services). External adapters are replaced with mocks in AbstractIntegrationTest.

spring.datasource.url=jdbc:h2:mem:clair-it;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Background jobs that would write data while a test runs.
claircore.local-edge.enabled=false
claircore.alerts.catch-up-initial-delay-ms=3600000
claircore.alerts.catch-up-interval-ms=3600000

# Placeholders without defaults in application.yml; dummy values, never contacted.
jwt.secret=integration-test-secret-key-with-at-least-256-bits-0123456789
google.oauth.client-id=it-google-client-id
google.oauth.client-secret=it-google-client-secret
google.oauth.redirect-uri=http://localhost/it/google/callback
frontend.url=http://localhost:4200
stripe.api.key=sk_test_integration
stripe.public.key=pk_test_integration
stripe.webhook.secret=whsec_integration
onesignal.rest-api-key=it-onesignal-key
onesignal.app-id=it-onesignal-app
